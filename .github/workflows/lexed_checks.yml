name: lexed_checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CC: clang
  CXX: clang++

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
        with:
          version: "9"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: typos
        uses: crate-ci/typos@2d0ce569feab1f8752f1dde43cc2f2aa53236e06 # v1.29.4
        with:
          config: ./typos.toml

      - name: check-todos
        run: ./script/check-todos

      - name: shellcheck
        run: ./script/shellcheck-scripts error

      - name: prettier
        run: ./script/prettier

      - name: Disk usage
        if: always()
        run: df -h

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Zed's CI-only `-D warnings` trick: cargo merges a config placed in a
      # parent directory of the workspace, so the checkout itself stays clean.
      # The mold selection rides along in the same file for the same reason —
      # `.cargo/ci-config.toml` is upstream-owned and stays untouched.
      - name: Set up CI cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install mold and select it as the linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          {
            echo
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >>./../.cargo/config.toml

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: clippy

      # Complements rust-cache rather than replacing it: rust-cache restores
      # this branch's whole target directory from the 10 GB branch-scoped
      # GitHub cache, while sccache adds per-compilation-unit hits from a
      # bucket shared across every branch and repo. That is what a cold
      # feature branch, where rust-cache necessarily misses, has to fall back
      # on. No-ops when the secret is absent, so fork PRs stay green.
      - name: Enable sccache (GCS)
        uses: arthur-debert/release/.github/actions/setup-sccache@96398d00d107d6336c945d1b690a7f2845d01450 # v3.11.0
        with:
          gcs-key: ${{ secrets.SCCACHE_GCS_KEY }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./script/linux

      - name: Download WASI SDK
        if: runner.os == 'Linux'
        run: ./script/download-wasi-sdk

      - name: Limit target directory size
        run: ./script/clear-target-dir-if-larger-than 350 200

      - name: clippy
        run: ./script/clippy

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || true

      - name: Remove CI cargo config
        if: always()
        run: rm -rf ./../.cargo

  tests:
    name: Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 350

      # Only this job needs it. Clippy's target directory measures 5.7 GB;
      # building every test binary in the workspace produces 75 GB, which
      # leaves under 9 GB spare on a stock runner.
      - name: Reclaim runner disk space
        run: ./script/lexed-ci-reclaim-disk

      - name: Set up CI cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install mold and select it as the linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          {
            echo
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >>./../.cargo/config.toml

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: tests

      - name: Enable sccache (GCS)
        uses: arthur-debert/release/.github/actions/setup-sccache@96398d00d107d6336c945d1b690a7f2845d01450 # v3.11.0
        with:
          gcs-key: ${{ secrets.SCCACHE_GCS_KEY }}

      - name: Install Linux dependencies
        run: ./script/linux

      # gpui_wgpu's atlas tests ask wgpu for any adapter across all backends and
      # a stock runner has none: "vulkan drivers/libraries could not be loaded".
      # Lavapipe is a software Vulkan device, which is enough for these tests —
      # they allocate and free atlas tiles rather than measure rendering.
      - name: Install a software Vulkan driver
        run: sudo apt-get install -y mesa-vulkan-drivers

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Install nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest

      # On a pull request only the crates the branch touches (and everything
      # that depends on them) are worth running; a push to main always runs the
      # whole suite. The `lex_*` crates are the fork's own code and always run.
      - id: scope
        name: Compute test scope
        run: |
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "push build: running the full workspace"
            echo "filterset=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=350 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          packages="$(
            {
              LEXED_BASE_REF="origin/${GITHUB_BASE_REF}" script/lexed-changed-crates
              cargo metadata --format-version=1 --no-deps |
                jq -r '.packages[].name' |
                grep '^lex_' || true
            } | sort -u
          )"
          filterset="$(echo "$packages" | sed '/^$/d; s/.*/rdeps(&)/' | paste -sd '|' -)"
          echo "filterset: ${filterset}"
          echo "filterset=${filterset}" >>"$GITHUB_OUTPUT"

      - name: Limit target directory size
        run: ./script/clear-target-dir-if-larger-than 350 200

      # `.config/nextest.toml` is upstream-owned, so exclusions live here. Every
      # entry is one test, named exactly, with the reason it cannot pass — and
      # each one is coverage this fork is knowingly giving up. Excluding on both
      # paths rather than only the main-push one: a pull request that touches
      # `settings` or `auto_update` reaches these same tests through `rdeps()`.
      - name: cargo nextest
        env:
          FILTERSET: ${{ steps.scope.outputs.filterset }}
        run: |
          exclusions=(
            # `assets/settings/default.json` sets `auto_update` to false for
            # this fork; the test asserts the upstream default of true.
            'package(auto_update) and test(=tests::test_auto_update_defaults_to_true)'
            # Same default. Polling is gated on the setting, so the updater
            # never leaves Idle and the test's wait loop runs to the 60s timeout.
            'package(auto_update) and test(=tests::test_auto_update_downloads)'
            # Same default, asserted through the settings store instead.
            'package(settings) and test(=settings_store::tests::test_settings_store_basic)'
            # collab is the collaboration server, which this fork neither runs
            # nor ships. `test_both_dbs!` gives each of these a `_sqlite` twin
            # that runs the same body and passes, so what is dropped is the
            # postgres dialect, not the logic. Attaching a postgres service
            # instead was measured and cost more than it returned.
            'package(collab) and test(/_postgres$/)'
          )
          excluded="$(printf '%s or ' "${exclusions[@]}")"
          excluded="not (${excluded% or })"
          echo "excluding: ${excluded}"
          if [ -n "$FILTERSET" ]; then
            cargo nextest run --workspace --no-fail-fast --no-tests=warn -E "($FILTERSET) and ${excluded}"
          else
            # One fewer thread than the runner has cores. The whole suite runs
            # only here, and several of its randomized tests sit close to the
            # 60s per-test timeout in `.config/nextest.toml` — one measured 54s
            # of its 60s on the run that passed. Leaving a core spare trades a
            # little wall clock for the headroom those tests need, and the
            # timeout itself cannot be raised: that file is upstream-owned and
            # nextest has no command-line override for it.
            cargo nextest run --workspace --no-fail-fast --no-tests=warn --test-threads 3 -E "${excluded}"
          fi

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || true

      - name: Remove CI cargo config
        if: always()
        run: rm -rf ./../.cargo

  deps_and_security:
    name: Dependencies and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-machete@0.7.0,cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: cargo machete
        run: cargo machete

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check licenses bans sources

      - name: Disk usage
        if: always()
        run: df -h

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: check-licenses
        run: ./script/check-licenses

      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-about@0.8.2

      - name: generate-licenses
        run: ./script/generate-licenses

      - name: Disk usage
        if: always()
        run: df -h
